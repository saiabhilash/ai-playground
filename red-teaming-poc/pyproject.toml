[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrit-support-demo"
version = "0.1.0"
description = "Local, synthetic agent red-teaming demonstration using Microsoft PyRIT."
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyrit==1.1.0",
    "pydantic>=2.11.7,<3",
    "requests>=2.31,<3",
    "streamlit>=1.42,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
support-demo = "support_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
